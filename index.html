<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Common Phrases — English Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Audio Element (Single preloaded element with playsinline for universal mobile audio support) -->
  <audio id="phrase-audio" preload="auto" playsinline></audio>

  <!-- App Wrapper (Fixed 100dvh for zero mobile page scroll) -->
  <div class="app-container">

    <!-- Top Minimal Bar -->
    <header class="top-bar">
      <!-- Category Selector Pill -->
      <button class="cat-pill-btn" id="btn-open-categories" aria-label="Select Category">
        <span class="cat-icon">📂</span>
        <span class="cat-name" id="current-cat-display">All Phrases</span>
        <span class="cat-arrow">▾</span>
      </button>

      <!-- Autoplay Button -->
      <button class="autoplay-btn" id="btn-autoplay" aria-label="Auto play cards" title="Avto-ijro rejimi">
        <span id="autoplay-icon">▶</span>
        <span class="autoplay-label" id="autoplay-text">Avto</span>
      </button>

      <!-- Minimal Mode Switcher & Counter -->
      <div class="top-bar-right">
        <div class="view-switch" role="tablist">
          <button class="view-switch-btn active" data-view="card" role="tab">Card</button>
          <button class="view-switch-btn" data-view="list" role="tab">List</button>
          <button class="view-switch-btn" data-view="quiz" role="tab">Quiz</button>
        </div>
        <span class="counter-tag" id="card-counter">1/200</span>
      </div>
    </header>

    <!-- Thin Progress Bar -->
    <div class="progress-track">
      <div class="progress-indicator" id="progress-indicator" style="width: 0.5%;"></div>
    </div>

    <!-- ====================================================================
         VIEW 1: Pure Flashcard Mode (Zero-Scroll Mobile App Feel)
         ==================================================================== -->
    <section class="card-screen active-screen" id="screen-card">
      
      <!-- The 3D Card (Fills available space) -->
      <div class="card-touch-zone" id="card-touch-zone">
        <div class="flashcard" id="flashcard">
          
          <!-- Front Face: English -->
          <div class="card-face card-front">
            <div class="card-face-top">
              <span class="lang-chip">English</span>
              <span class="status-chip learning" id="front-status-chip">O'rganilmoqda</span>
              <span class="number-chip" id="front-card-number">#1</span>
            </div>

            <div class="card-face-center">
              <div class="card-phrase" id="front-text">Good morning, everyone.</div>
              
              <!-- Large Audio Play Button -->
              <button class="audio-action-btn" id="btn-play-front" aria-label="Play pronunciation audio">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <span>Listen Audio</span>
                <div class="wave-box" id="wave-front">
                  <span></span><span></span><span></span><span></span>
                </div>
              </button>
            </div>

            <div class="card-face-bottom">
              <span class="flip-hint">Tap card to see Uzbek</span>
            </div>
          </div>

          <!-- Back Face: Uzbek Translation -->
          <div class="card-face card-back">
            <div class="card-face-top">
              <span class="lang-chip uzbek">O'zbekcha</span>
              <span class="status-chip learning" id="back-status-chip">O'rganilmoqda</span>
              <span class="number-chip" id="back-card-number">#1</span>
            </div>

            <div class="card-face-center">
              <div class="card-phrase" id="back-text">Hammaga xayrli tong.</div>
              
              <!-- Large Audio Repeat Button -->
              <button class="audio-action-btn" id="btn-play-back" aria-label="Repeat English pronunciation">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <span>Repeat English</span>
                <div class="wave-box" id="wave-back">
                  <span></span><span></span><span></span><span></span>
                </div>
              </button>
            </div>

            <!-- Card Back Footer: Uzbek Mastery Labels -->
            <div class="card-face-bottom">
              <div class="uzbek-label-actions">
                <button class="label-btn btn-mastered" id="btn-label-mastered" title="O'zlashtirildi deb belgilash">
                  <span class="label-icon">✓</span>
                  <span>O'zlashtirildi</span>
                </button>
                <button class="label-btn btn-learning" id="btn-label-learning" title="O'rganilmoqda deb belgilash">
                  <span class="label-icon">🔄</span>
                  <span>O'rganilmoqda</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Bottom Touch Controls (Fixed Ergonomic Thumb Bar) -->
      <div class="bottom-controls">
        <button class="nav-control-btn" id="btn-prev" aria-label="Previous card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>Prev</span>
        </button>

        <button class="nav-control-btn main-flip-btn" id="btn-flip" aria-label="Flip card">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Flip</span>
        </button>

        <button class="nav-control-btn" id="btn-next" aria-label="Next card">
          <span>Next</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </div>

    </section>

    <!-- ====================================================================
         VIEW 2: Clean List Mode
         ==================================================================== -->
    <section class="list-screen" id="screen-list" style="display: none;">
      <div class="list-container" id="list-container">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- ====================================================================
         VIEW 3: Clean Practice Quiz
         ==================================================================== -->
    <section class="quiz-screen" id="screen-quiz" style="display: none;">
      <div class="quiz-box">
        <div class="quiz-top">
          <span class="quiz-label">Translate this phrase:</span>
          <span class="quiz-score" id="quiz-score">Score: 0/0</span>
        </div>

        <div class="quiz-prompt">
          <div class="quiz-en-text" id="quiz-en-text">Good morning, everyone.</div>
          <button class="audio-action-btn mini" id="btn-quiz-audio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span>Play Audio</span>
          </button>
        </div>

        <div class="quiz-choices" id="quiz-choices">
          <!-- 4 Multiple choice buttons -->
        </div>

        <div class="quiz-bottom">
          <div class="quiz-status" id="quiz-status">Select the correct Uzbek translation</div>
          <button class="nav-control-btn main-flip-btn" id="btn-quiz-next" style="display: none;">Next →</button>
        </div>
      </div>
    </section>

  </div>

  <!-- Categories Bottom Sheet / Modal -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="category-sheet" id="category-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Kategoriyalar</span>
      <button class="sheet-close" id="btn-close-sheet">✕</button>
    </div>

    <!-- Quick Search -->
    <div class="sheet-search">
      <input type="text" id="sheet-search-input" placeholder="Qidirish (inglizcha yoki o'zbekcha)..." autocomplete="off">
    </div>

    <!-- Category Items List -->
    <div class="sheet-list" id="category-sheet-list">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
